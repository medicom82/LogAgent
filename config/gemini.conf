# ============================================
# Google Gemini AI Configuration
# ============================================

# API Configuration
gemini_api_key=${GEMINI_API_KEY}
gemini_api_version=v1
gemini_api_endpoint=https://generativelanguage.googleapis.com

# Model Configuration
model_name=gemini-pro
model_temperature=0.3
model_top_p=0.9
model_top_k=40
model_max_output_tokens=2048

# Request Configuration
request_timeout_seconds=30
max_retries=3
retry_delay_seconds=1

# ============================================
# Prompt Templates
# ============================================

# Anomaly Analysis Prompt
prompt_anomaly_analysis="""
Analyze the following security log anomaly and provide insights:
Log Type: {log_type}
Timestamp: {timestamp}
Severity: {severity}
Description: {description}
Log Details: {log_details}

Please provide:
1. Potential threat assessment
2. Root cause analysis
3. Recommended actions
4. Risk level (1-10)
"""

# Query Generation Prompt
prompt_query_generation="""
Based on the following detected anomaly, generate an SQL query to investigate:
Anomaly Type: {anomaly_type}
Anomaly Details: {details}
Time Window: {time_window}
Server: {server_id}
Database: {database}

Generate a SQL query that will help investigate this anomaly further.
Only provide the SQL query, no explanation.
"""

# Threat Analysis Prompt
prompt_threat_analysis="""
Perform threat intelligence analysis on the following logs:
Time Period: {time_period}
Server: {server_id}
Log Sample: {log_sample}

Provide:
1. Threat indicators
2. Attack patterns (if any)
3. Confidence score
4. Recommended security measures
"""

# Recommendation Prompt
prompt_recommendation="""
Based on the detected anomalies and historical patterns, provide security recommendations:
Anomaly Summary: {summary}
Historical Context: {context}
Current Severity: {severity}

Provide:
1. Immediate actions
2. Short-term improvements
3. Long-term hardening
4. Monitoring enhancements
"""

# ============================================
# Integration Settings
# ============================================

# Enable Gemini analysis
enable_gemini_analysis=true

# Minimum confidence score for alerts
min_confidence_for_alert=0.65

# Batch analysis (process multiple anomalies together)
enable_batch_analysis=true
batch_size=5

# Caching of similar analyses (to reduce API calls)
enable_response_caching=true
cache_ttl_hours=24

# Rate limiting
max_requests_per_minute=60
max_requests_per_hour=3600

# ============================================
# Logging and Monitoring
# ============================================

# Log all Gemini interactions
log_interactions=true
log_level=INFO

# Save responses to database for audit
save_interactions_to_db=true

# Performance metrics
track_response_time=true
track_token_usage=true
