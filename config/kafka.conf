# ============================================
# Kafka Configuration
# ============================================

# Bootstrap Servers
bootstrap.servers=kafka:29092

# Consumer Configuration
group.id=logagent-consumer-group
enable.auto.commit=true
auto.commit.interval.ms=5000
auto.offset.reset=earliest
max.poll.records=500

# Producer Configuration
acks=all
retries=3
batch.size=32768
linger.ms=10
compression.type=snappy

# Session Configuration
session.timeout.ms=30000
heartbeat.interval.ms=10000

# Topic Configuration
num.partitions=3
replication.factor=1

# Topics to create
topics[0].name=log-stream
topics[0].partitions=3
topics[0].replication_factor=1

topics[1].name=anomalies
topics[1].partitions=2
topics[1].replication_factor=1

topics[2].name=events
topics[2].partitions=3
topics[2].replication_factor=1

topics[3].name=alerts
topics[3].partitions=1
topics[3].replication_factor=1

# Performance
fetch.min.bytes=1024
fetch.max.wait.ms=500
connections.max.idle.ms=300000

# Security (if enabled)
# security.protocol=SASL_SSL
# sasl.mechanism=PLAIN
# sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="password";
