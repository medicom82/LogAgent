# ============================================
# MySQL Configuration for LogAgent
# ============================================

[client]
host=localhost
port=3306
user=logagent
password=logagent_password
database=logagent

[mysql]
# MySQL client options
show-warnings

[mysqldump]
quick
quote-names
max_allowed_packet=16M

# ============================================
# Connection Pool Settings
# ============================================

# Connection timeout in seconds
connection_timeout=30

# Number of connection pool threads
pool_size=5
max_overflow=10

# Connection pool recycle time (seconds)
pool_recycle=3600

# Connection pool pre-ping (validate before use)
pool_pre_ping=true

# ============================================
# Query Optimization
# ============================================

# Enable query caching
query_cache_size=64M
query_cache_type=1

# Enable index hints
optimizer_search_depth=62
optimizer_prune_level=1

# ============================================
# Data Retention Policy
# ============================================

# Archive logs older than X days
archive_retention_days=90

# Partition logs by date for performance
enable_partitioning=true
partition_interval=month

# ============================================
# Replication Settings (if using master-slave)
# ============================================

# server_id=1
# log_bin=mysql-bin
# binlog_format=ROW
# relay_log=mysql-relay-bin
# relay_log_index=mysql-relay-bin.index

# ============================================
# Performance Tuning
# ============================================

# Buffer pool size (recommended: 50-80% of RAM)
innodb_buffer_pool_size=2G

# Log file size
innodb_log_file_size=512M

# Flush method
innodb_flush_method=O_DIRECT

# Flush log at commit
innodb_flush_log_at_trx_commit=2

# Max connections
max_connections=1000

# Default storage engine
default_storage_engine=InnoDB
